# 配置範例：config/settings.yaml 主要配置項（現役工具）
# 說明：多數使用者只需 .env 填 API key 即可；此檔展示可選的預設值覆蓋。

# LLM 後端（--llm-provider auto 會自動挑可用者）
llm:
  default_backend: "auto"
  auto_select: true
  ollama:
    base_url: "http://localhost:11434"
    default_model: "llama3.2"
  google:
    default_model: "gemini-2.5-flash"
  openai:
    default_model: "gpt-4o-mini"
  anthropic:
    default_model: "claude-haiku-4-5"
  # NVIDIA NIM（OpenAI 相容）：預設用實測穩定的 8b；
  # 大模型改經 NVIDIA_SLIDES_MODEL / NVIDIA_ZETTEL_MODEL 或 --model 覆寫
  nvidia:
    default_model: "meta/llama-3.1-8b-instruct"

# PDF 處理
pdf:
  max_characters: 50000
  extraction_method: "pdfplumber"  # 或 "pypdf2"

# 投影片生成（uv run slides）
slides:
  default_style: "modern_academic"
  default_detail: "standard"
  default_language: "chinese"
  default_slides: 15

# Zettelkasten 卡片生成（uv run zettel）
zettel:
  default_detail: "standard"
  default_language: "chinese"
  default_domain: "Research"
