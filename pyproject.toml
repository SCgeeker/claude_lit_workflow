[project]
name = "claude-lit-workflow"
version = "0.12.0"
description = "知識生產器 - Claude Code 驅動的學術文獻處理系統"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Sau-Chin Chen" }
]
keywords = ["academic", "literature", "zettelkasten", "knowledge-base", "pdf"]

dependencies = [
    # PDF Processing
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.10.0",
    # Document Generation
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "markdown>=3.5",
    # Configuration & Templates
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    # LLM Integration
    "requests>=2.31.0",
    "anthropic>=0.72.0",
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
    # CLI & UI
    "rich>=13.0.0",
    "typer>=0.9.0",
    # Data Processing
    "pydantic>=2.5.0",
    "bibtexparser>=1.4.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    # Vector Database & Embeddings
    "chromadb>=0.4.22",
    # Optional: Advanced PDF features
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
    # Web extraction
    "trafilatura>=1.6.0",
    "mcp>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# 核心工具
setup = "claude_lit.cli.setup_check:main"
slides = "claude_lit.cli.slides:main"
zettel = "claude_lit.cli.zettel:main"
mcp-server = "claude_lit.mcp_server.__main__:main"

# 暫停工具（analyze/kb/embeddings）不入 wheel，改以 `uv run python analyze_paper.py` 執行

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_lit"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
# 測試只收集 tests/；scripts/、examples/ 內的 *_test.py 為工具腳本，非測試套件
testpaths = ["tests"]
markers = [
    "slow: 需要建置與安裝的長時間測試（wheel 冒煙）",
]
